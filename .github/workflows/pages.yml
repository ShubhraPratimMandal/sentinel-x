name: Public Demo Build

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-demo-build
  cancel-in-progress: true

jobs:
  build:
    name: Build public demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-x-public-demo
          path: apps/web/dist
          retention-days: 14
